<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <title>Azat Rahmanov - Personal website</title>
    <meta
      name="description"
      content="Azat Rahmanov - front-end developer with five years of experience building responsive, high-quality web applications with JavaScript, React and Tailwind CSS."
    />
    <meta name="author" content="Azat Rahmanov" />
    <link rel="canonical" href="https://rahmanow.com/" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.png" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />
    <!-- Metadata used when the site is installed to a home screen or desktop. -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Link previews. og:image must be an absolute URL, so it cannot use
         %PUBLIC_URL%, which resolves to a site-root-relative path. The image is
         square, which is what twitter:card=summary expects; a large card would
         need a 1.91:1 asset instead. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="rahmanow.com" />
    <meta property="og:url" content="https://rahmanow.com/" />
    <meta property="og:title" content="Azat Rahmanov - Personal website" />
    <meta
      property="og:description"
      content="Azat Rahmanov - front-end developer with five years of experience building responsive, high-quality web applications with JavaScript, React and Tailwind CSS."
    />
    <meta property="og:image" content="https://rahmanow.com/img/icon-512.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="512" />
    <meta property="og:image:height" content="512" />
    <meta property="og:image:alt" content="Illustrated portrait of Azat Rahmanov" />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@Azadik" />
    <meta name="twitter:creator" content="@Azadik" />
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
